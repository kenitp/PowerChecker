[package]
name = "power-checker"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.4"
base64 = "0.22"
futures = "0.3.31"
hmac = "0.12"
hyper = "1.7.0"
regex = "1.11.2"
reqwest = "0.12.23"
serde = { version = "^1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serialport = "4.7.3"
sha2 = "0.10"
tokio = { version = "1.47.1", features = ["full"] }
tower = "0.5.2"
uuid = { version = "1.11", features = ["v4"] }
dotenvy = "0.15"