services:
  power-checker:
    build: .
    container_name: power-checker
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Home Assistant は host ネットワークで動作しているためゲートウェイ経由で参照する
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - SERVER_IP=0.0.0.0
